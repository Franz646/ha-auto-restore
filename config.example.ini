# Copy this file to config.ini (next to ha_restore.py) and edit it.
# config.ini is in .gitignore: it describes your network, keep it private.
# Paths may use ~ and environment variables (%USERPROFILE% on Windows, $HOME elsewhere).

[homeassistant]
# IP address (better than homeassistant.local: mDNS may be down when HA is broken)
host = 192.168.1.10
# port of your configured HA; a fresh HAOS onboarding uses 80, the tool follows it by itself
port = 8123

[ssh]
# SSH app ("Advanced SSH & Web Terminal" or "Terminal & SSH") with key login.
# host may be an alias from ~/.ssh/config (recommended: put key, user, ciphers there).
host = 192.168.1.10
# user of the SSH app: root for "Terminal & SSH", the username set in the app options for
# "Advanced SSH & Web Terminal" (leave empty if your ~/.ssh/config alias sets it)
user = root
port = 22
# HAOS system SSH (root, enabled with a USB stick named CONFIG, see README)
system_port = 22222

[backup_key]
# where the backup encryption key comes from:
#   dpapi  - Windows only, saved encrypted for your user by save_backup_key.ps1 (default on Windows)
#   file   - plain text file readable only by you (chmod 600), on encrypted storage
#   prompt - asked every time it is needed (default elsewhere)
storage = dpapi
file = ~/.ha-auto-restore/backup_key.dpapi

[backup_sources]
# name = folder containing the .tar backups; the newest usable one wins.
# Use places that survive the HA box: NAS share, cloud-synced folder, local copy.
nas = \\192.168.1.20\homeassistant
google_drive = G:\My Drive\Home Assistant Backups
local = ~/ha-auto-restore/backups

[paths]
# local emergency copy of this tool, refreshed by "ha_restore.py sync"
emergency_dir = ~/ha-auto-restore
